<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-BKXQGawmwI7635RM+Ieu489p3D86ey1XaQdbx8FWYc0='; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; frame-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>현대모비스마북어린이집 석식 신청</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    html, body { margin: 0; height: 100%; background: #f8fafc; font-family: 'Pretendard Variable', Pretendard, sans-serif; }
    body { display: flex; flex-direction: column; }
    iframe { flex: 1; display: block; width: 100%; border: 0; }
    .foot { flex: none; padding: 6px 12px; font-size: 11px; color: #64748b; text-align: center; border-top: 1px solid #e2e8f0; background: #fff; }
    noscript p { padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <noscript><p>이 서비스를 이용하려면 브라우저의 자바스크립트를 켜 주세요.</p></noscript>
  <iframe
    src="https://script.google.com/macros/s/AKfycbwapic08de-zCDncYhc83R8PtpLzDWqz8Cm7ak7VcfMo5m2kcxBzkZGGtmRB21x2epp/exec"
    title="석식 신청"
    referrerpolicy="strict-origin-when-cross-origin"
    loading="eager"></iframe>

  <div class="foot">운영: 현대모비스마북어린이집</div>

  <script>
    // 차단
    if (window.top !== window.self) {
      try { window.top.location.replace(window.self.location.href); }
      catch (e) { document.documentElement.textContent = ""; }
    }
  </script>
</body>
</html>
